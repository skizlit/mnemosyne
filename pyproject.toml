[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-memory"
version = "0.0.0"
description = "Local-first, Markdown-native memory for Project Void"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pyyaml>=6.0",
  "pytest>=8",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["*_tests.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
