name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch pull request history
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Scan proposed changes for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Audit complete Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --config .gitleaks.toml --redact --log-opts="--all" .

  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch pull request history
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check complete history against repository boundary
        run: python tools/check_repository_safety.py --history

      - name: Verify positive and negative fixtures
        run: python -m pytest tests/tools/check_repository_safety_tests.py
